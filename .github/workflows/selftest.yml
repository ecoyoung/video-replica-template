name: selftest

on:
  push:
  pull_request:

jobs:
  stdlib:
    name: stdlib detector (python ${{ matrix.python }})
    # 3.9 is not available on the newest runner image, pin the older LTS for the matrix
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python scripts/selftest.py

  opencv:
    name: cv2 detector (numpy + opencv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install numpy opencv-python-headless
      - run: python scripts/selftest.py
      - run: python scripts/desk.py doctor
